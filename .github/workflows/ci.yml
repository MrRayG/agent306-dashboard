# ─────────────────────────────────────────────────────────────────────────────
# 306 — CI (Phase 1 closure)
#
# Required / blocking surface for this PR:
#   1. Install dependencies
#   2. Typecheck (tsc)
#   3. Phase 1 safety tests (auth + promotion gate) — dedicated job that
#      cannot be bypassed by changes to `npm test`.
#
# Advisory / non-blocking:
#   - Aggregate `npm test` suite. It currently surfaces ~31 pre-existing
#     failures unrelated to Phase 1 hardening. We keep it visible in CI as
#     `continue-on-error: true` so progress is observable, but it is not a
#     merge gate until the pre-existing failures are cleaned up in a
#     follow-up. Do NOT mark this job required in branch protection until
#     that cleanup lands.
#
# Branch protection should require: `typecheck` and
# `phase 1 safety tests (auth + promotion gate)`.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

  safety:
    name: phase 1 safety tests (auth + promotion gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 1 safety subset
        run: npm run test:safety
        env:
          NODE_ENV: test

  # Advisory only — surfaces the full repo test suite for visibility.
  # ~31 pre-existing failures are known and tracked for cleanup outside
  # this PR. `continue-on-error: true` keeps this job non-blocking.
  aggregate-tests:
    name: aggregate test suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run aggregate test suite (advisory, non-blocking)
        run: npm test
        env:
          NODE_ENV: test
