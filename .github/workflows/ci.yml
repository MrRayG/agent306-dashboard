# ─────────────────────────────────────────────────────────────────────────────
# 306 — CI
#
# Required / blocking surface:
#   1. Install dependencies
#   2. Typecheck (tsc)
#   3. Phase 1 safety tests (auth + promotion gate) — dedicated job that
#      cannot be bypassed by changes to `npm test`.
#   4. Aggregate `npm test` suite — full repo test suite, blocking.
#   5. Core-state integrity guard (Issue #330) — runs npm test under a
#      pre/post snapshot of the four core agent-state files and the
#      tmp-blog-legacy-* root leak pattern. Hard-fails on any mutation.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

  safety:
    name: phase 1 safety tests (auth + promotion gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 1 safety subset
        run: npm run test:safety
        env:
          NODE_ENV: test

  aggregate-tests:
    name: aggregate test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run aggregate test suite
        run: npm test
        env:
          NODE_ENV: test

  core-state-integrity:
    name: core-state integrity guard (Issue #330)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify npm test does not mutate core agent state
        run: bash scripts/checkCoreStateIntegrity.sh
        env:
          NODE_ENV: test

  agent306-safety-gates:
    # Phase 4-b post-merge safety gates:
    #   1. Promotion-boundary audit must exit 0 (no second status='applied'
    #      write site, applyRecommendation still gates on approved +
    #      canPromote(rec).ok). The script already exits 2 on `status=
    #      violated`, so adding it here is enough to fail the PR.
    #   2. Intake-gate enforcement + bypass-guard tests must pass. These
    #      already run inside the aggregate `npm test` job — running the
    #      pinned subset here surfaces the failure on its own dedicated
    #      check line so the operator sees WHICH gate failed at a glance.
    #
    # This job intentionally duplicates a small slice of the aggregate
    # job's coverage. The duplication is the point: the boundary +
    # intake-gate invariants are load-bearing for the propose-only
    # contract, and a separate green-check is cheaper than diagnosing a
    # red aggregate that bundles unrelated failures.
    name: agent306-safety-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promotion-boundary audit (single-write-site invariant)
        run: npx tsx scripts/auditPromotionBoundary.ts
        env:
          NODE_ENV: test

      - name: Intake-gate enforcement + bypass-guard + first-run migration tests
        run: >-
          npx tsx --test
          server/__tests__/intakeGateEnforcement.test.ts
          server/__tests__/intakeGateBypassGuard.test.ts
          server/__tests__/migrationFirstRunGuard.test.ts
        env:
          NODE_ENV: test

      # Skill governance: validate skills/registry.yaml + every SKILLCARD.yaml.
      # Read-only, manual-only, stdout-only CLI. Exits non-zero on any card
      # widening (writes.* != false, promotion_authority != none,
      # policy.expands_autonomy != false, policy.propose_only != true) or on
      # any structural / append-only violation.
      - name: Skill governance card + registry validator
        run: npm run skills:validate
        env:
          NODE_ENV: test

      - name: Skill governance unit + pilot-card tests
        run: >-
          npx tsx --test
          server/__tests__/skillCardValidator.test.ts
          server/__tests__/skillCardRegistryAppendOnly.test.ts
          server/__tests__/skillCardPromotionBoundaryAudit.test.ts
        env:
          NODE_ENV: test
