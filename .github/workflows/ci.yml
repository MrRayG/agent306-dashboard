# ─────────────────────────────────────────────────────────────────────────────
# 306 — CI
#
# Required / blocking surface:
#   1. Install dependencies
#   2. Typecheck (tsc)
#   3. Phase 1 safety tests (auth + promotion gate) — dedicated job that
#      cannot be bypassed by changes to `npm test`.
#   4. Aggregate `npm test` suite — full repo test suite, blocking.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

  safety:
    name: phase 1 safety tests (auth + promotion gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 1 safety subset
        run: npm run test:safety
        env:
          NODE_ENV: test

  aggregate-tests:
    name: aggregate test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run aggregate test suite
        run: npm test
        env:
          NODE_ENV: test
